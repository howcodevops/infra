apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sserviceaccountsecurity
  annotations:
    # ensure ArgoCD applies templates early if you use ArgoCD (optional)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  crd:
    spec:
      names:
        kind: K8sServiceAccountSecurity
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sserviceaccountsecurity

        #########################
        # Generic inventory walkers (robust across inventory shapes)
        #########################

        # walk_inventory_obj(obj) is true for any object found somewhere in data.inventory
        walk_inventory_obj(obj) {
          inv := data.inventory
          some top
          topmap := inv[top]

          # topmap can be a map of kinds -> lists (common), or a list (rare). handle common case:
          some kind
          list := topmap[kind]
          obj = list[_]
        }

        # find any object of a given kind (case-sensitive match against object's "kind" field)
        inventory_kind_obj(kind_name, obj) {
          some o
          walk_inventory_obj(o)
          o.kind == kind_name
          obj = o
        }

        #########################
        # Helpers for ServiceAccount & ClusterRoleBinding (FIXED)
        #########################

        # sa_exists: true if a ServiceAccount with name/namespace is present in inventory
        sa_exists(ns, name) {
          inventory_kind_obj("ServiceAccount", sa)
          sa.metadata.namespace == ns
          sa.metadata.name == name
        }

        # crb_exists / iterate CRBs robustly
        crb_is_cluster_admin(crb) {
          crb.roleRef.kind == "ClusterRole"
          crb.roleRef.name == "cluster-admin"
        }

        # true if a ClusterRoleBinding binds the named SA in the given ns to cluster-admin
        sa_bound_to_cluster_admin(ns, name) {
          inventory_kind_obj("ClusterRoleBinding", crb)
          crb_is_cluster_admin(crb)
          subj := crb.subjects[_]
          subj.kind == "ServiceAccount"
          subj.namespace == ns
          subj.name == name
        }

        #########################
        # Violations
        #########################

        # 1) Pod-level: automountServiceAccountToken must not be true
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          pod := input.review.object
          pod.spec.automountServiceAccountToken == true
          msg := sprintf("Pod <%v/%v> sets automountServiceAccountToken=true which is disallowed.", [pod.metadata.namespace, pod.metadata.name])
        }

        # 2) ServiceAccount: automount must not be true
        violation[{"msg": msg}] {
          input.review.kind.kind == "ServiceAccount"
          sa := input.review.object
          sa.automountServiceAccountToken == true
          msg := sprintf("ServiceAccount <%v/%v> sets automountServiceAccountToken=true which is disallowed.", [sa.metadata.namespace, sa.metadata.name])
        }

        # 3) Pod: deny if ServiceAccount is bound to cluster-admin
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          pod := input.review.object
          ns := pod.metadata.namespace
          saName := pod.spec.serviceAccountName
          saName == ""  # default SA case
          sa_bound_to_cluster_admin(ns, "default")
          msg := sprintf("Pod <%v/%v> uses default ServiceAccount bound to cluster-admin; disallowed.", [ns, pod.metadata.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          pod := input.review.object
          ns := pod.metadata.namespace
          saName := pod.spec.serviceAccountName
          saName != ""
          sa_bound_to_cluster_admin(ns, saName)
          msg := sprintf("Pod <%v/%v> uses ServiceAccount <%v> bound to cluster-admin; disallowed.", [ns, pod.metadata.name, saName])
        }

        # 4) Pod: deny if ServiceAccount doesn't exist (safety check)
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          pod := input.review.object
          ns := pod.metadata.namespace
          saName := pod.spec.serviceAccountName
          saName == ""
          not sa_exists(ns, "default")
          msg := sprintf("Pod <%v/%v> references default ServiceAccount which does not exist.", [ns, pod.metadata.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          pod := input.review.object
          ns := pod.metadata.namespace
          saName := pod.spec.serviceAccountName
          saName != ""
          not sa_exists(ns, saName)
          msg := sprintf("Pod <%v/%v> references ServiceAccount <%v> which does not exist.", [ns, pod.metadata.name, saName])
        }
