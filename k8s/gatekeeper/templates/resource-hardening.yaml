apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sresourcehardening
spec:
  crd:
    spec:
      names:
        kind: K8sResourceHardening
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sresourcehardening

        # Helper to iterate all containers
        all_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        all_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        # 1. Require CPU/memory requests & limits
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.resources.requests.cpu
          msg := sprintf("container <%v> must have CPU requests", [c.name])
        }
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.resources.requests.memory
          msg := sprintf("container <%v> must have memory requests", [c.name])
        }
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.resources.limits.cpu
          msg := sprintf("container <%v> must have CPU limits", [c.name])
        }
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.resources.limits.memory
          msg := sprintf("container <%v> must have memory limits", [c.name])
        }

        # 2. Require liveness/readiness probes
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.livenessProbe
          msg := sprintf("container <%v> must have livenessProbe", [c.name])
        }
        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.readinessProbe
          msg := sprintf("container <%v> must have readinessProbe", [c.name])
        }
