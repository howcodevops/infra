apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowplaintextsecrets
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowPlaintextSecrets
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowplaintextsecrets

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          env := c.env[_]
          val := env.value
          val != ""
          msg := sprintf("container <%v> has plaintext env var <%v> — use a Kubernetes Secret instead", [c.name, env.name])
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          envFrom := c.envFrom[_]
          envFrom.secretRef == null
          msg := sprintf("container <%v> uses envFrom not backed by Secret — avoid plaintext ConfigMaps for sensitive data", [c.name])
        }
