# ❌ Violates "no privileged" (privileged=true)
apiVersion: v1
kind: Pod
metadata:
  name: test-privileged
  namespace: frontend
spec:
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648
      securityContext:
        privileged: true  # <-- ❌ Not allowed

---
