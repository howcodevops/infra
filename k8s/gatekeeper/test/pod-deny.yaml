kind: Pod
metadata:
  name: fail-nginx
  namespace: default  
spec:
  containers:
    - name: c1
      image: gcr.io/distroless/static-debian12@sha256:8e0c74f4f52f34c2917bb8b51f7319a0ff6de2b0b34c30c7baf18a8d8d8d8a45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      ports:
        - containerPort: 8080
