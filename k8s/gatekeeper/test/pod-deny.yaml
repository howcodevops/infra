# ❌ Missing CPU request
apiVersion: v1
kind: Pod
metadata:
  name: test-no-cpu-request
  namespace: frontend
spec:
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648
      resources:
        requests:
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80

