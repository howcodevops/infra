  name: test-hostnetwork
  namespace: frontend
spec:
  hostNetwork: true   # <-- ❌ Not allowed
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648

---
# ❌ Violates "must run as non-root" (UID 0)
apiVersion: v1
kind: Pod
metadata:
  name: test-rootuser
  namespace: frontend
spec:
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648
      securityContext:
        runAsUser: 0  # <-- ❌ Explicit root UID

---
# ❌ Violates "require seccompProfile=RuntimeDefault"
apiVersion: v1
kind: Pod
metadata:
  name: test-seccomp
  namespace: frontend
spec:
  securityContext:
    seccompProfile:
      type: Unconfined  # <-- ❌ Must be RuntimeDefault
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648

---
# ❌ Violates "must drop ALL caps + readOnlyRootFilesystem"
apiVersion: v1
kind: Pod
metadata:
  name: test-caps-rootfs
  namespace: frontend
spec:
  containers:
    - name: c1
      image: nginx@sha256:3d8957cb61d0223de2ab1aa2ec91d29796eb82a81cdcc1e968c090c29606d648
      securityContext:
        capabilities:
          drop: ["NET_RAW"]  # <-- ❌ Needs to be ["ALL"]
        readOnlyRootFilesystem: false  # <-- ❌ Must be true
---
# ❌ Violates "image digest ande letest"
apiVersion: v1
kind: Pod
metadata:
  name: test-image-digest-latest
  namespace: frontend
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault  
  containers:
    - name: c1
      image: nginx:1.25
      securityContext:
        runAsNonRoot: true      
        runAsUser: 1000            
        privileged: false       
        readOnlyRootFilesystem: true 
        capabilities:
          drop: ["ALL"]            
