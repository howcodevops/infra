apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-template
  namespace: argocd
spec:
  project: demo-proj
  source:
    repoURL: https://github.com/howcodevops/demo-gitops
    targetRevision: main
    path: k8s/gatekeeper/templates
  destination:
    server: https://kubernetes.default.svc
    namespace: ""
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
