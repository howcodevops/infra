apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: demo-proj
  source:
    repoURL: https://github.com/howcodevops/demo-gitops
    targetRevision: HEAD
    path: k8s
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: ""   # cluster-scoped resources like Gatekeeper will work
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
